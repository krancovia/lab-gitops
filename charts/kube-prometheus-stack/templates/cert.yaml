apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
spec:
  commonName: grafana.lab.krancovia.io
  dnsNames:
  - grafana.lab.krancovia.io
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-gandi
  secretName: grafana-tls
