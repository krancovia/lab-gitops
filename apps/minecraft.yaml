apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://itzg.github.io/minecraft-server-charts
    chart: minecraft-bedrock
    targetRevision: 2.8.1
    helm:
      valueFiles:
      - $values/minecraft/values.yaml
  - repoURL: https://github.com/krancovia/lab-gitops.git
    path: minecraft/manifests
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft
  syncPolicy:
    syncOptions:
    - CreateNamespace=true 
