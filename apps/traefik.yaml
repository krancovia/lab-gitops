apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://helm.traefik.io/traefik
    chart: traefik
    targetRevision: 31.1.1
    helm:
      valueFiles:
      - $values/traefik/values.yaml
  - repoURL: https://github.com/krancovia/lab-gitops.git
    path: traefik/manifests
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    syncOptions:
    - CreateNamespace=true 
